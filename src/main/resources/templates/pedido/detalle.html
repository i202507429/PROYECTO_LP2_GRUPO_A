<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head}">
	<title>Detalle del Pedido</title>
</head>

<body class="bg-light">

	<div th:replace="~{fragments :: navbar}"></div>

	<div class="container py-4">

		<div class="d-flex justify-content-between align-items-center mb-4">
			<h2><i class="fa-solid fa-receipt me-2"></i>Detalle del Pedido #<span th:text="${pedido.idPedido}"></span></h2>
			<a href="/pedido/listado" class="btn btn-secondary">
				<i class="fa-solid fa-arrow-left me-1"></i>Volver
			</a>
		</div>

		<div class="card shadow-sm mb-3">
			<div class="card-body">
				<div class="row">
					<div class="col-md-3">
						<p class="mb-1"><span class="fw-bold">Cliente:</span>
							<span th:text="${pedido.nombreCliente != null ? pedido.nombreCliente : (pedido.usuario.nombres + ' ' + pedido.usuario.apellidos)}"></span>
						</p>
					</div>
					<div class="col-md-3">
						<p class="mb-1"><span class="fw-bold">Fecha:</span>
							<span th:text="${#temporals.format(pedido.fecha, 'dd/MM/yyyy HH:mm')}"></span>
						</p>
					</div>
					<div class="col-md-3">
						<p class="mb-1"><span class="fw-bold">Pago:</span>
							<span th:text="${pedido.metodoPago ?: '-'}"></span>
						</p>
					</div>
					<div class="col-md-3">
						<p class="mb-1"><span class="fw-bold">Estado:</span>
							<span th:text="${pedido.estado}" class="text-capitalize"></span>
						</p>
					</div>
				</div>
			</div>
		</div>

		<div class="card shadow-sm mb-3">
			<div class="card-body">
				<table class="table table-sm mb-0">
					<thead>
						<tr>
							<th>Item</th>
							<th class="text-center">Cant.</th>
							<th class="text-end">Subtotal</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="dp : ${lstDetallePizza}">
							<td th:text="${dp.pizzaTamanio.pizza.nombre + ' (' + dp.pizzaTamanio.tamanio.descripcion + ')'}"></td>
							<td class="text-center" th:text="${dp.cantidad}"></td>
							<td class="text-end" th:text="'S/ ' + ${#numbers.formatDecimal(dp.subtotal, 1, 2)}"></td>
						</tr>
						<tr th:each="da : ${lstDetalleAdicional}">
							<td th:text="${da.adicional.descripcion}"></td>
							<td class="text-center" th:text="${da.cantidad}"></td>
							<td class="text-end" th:text="'S/ ' + ${#numbers.formatDecimal(da.subtotal, 1, 2)}"></td>
						</tr>
					</tbody>
				</table>
				<hr>
				<h5 class="text-end mb-0">Total: <span class="text-success fw-bold" th:text="'S/ ' + ${#numbers.formatDecimal(pedido.total, 1, 2)}"></span></h5>
			</div>
		</div>

	</div>

	<div th:if="${toast}" th:utext="${toast}"></div>

</body>

</html>
