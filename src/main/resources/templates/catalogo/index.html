<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head}">
    <title>Catálogo</title>
</head>

<body class="bg-light">

<!-- NAVBAR FIJO -->
<nav class="navbar navbar-dark bg-danger sticky-top shadow-sm">
    <div class="container">
        <span class="navbar-brand mb-0 h1">
            <i class="fa-solid fa-pizza-slice me-2"></i>Pizzería
        </span>
        <button class="btn btn-light position-relative" data-bs-toggle="offcanvas" data-bs-target="#carrito">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="badge bg-dark position-absolute top-0 start-100 translate-middle rounded-pill"
                  id="contadorCarrito">0</span>
        </button>
    </div>
</nav>

<div class="container py-4 pb-5">

    <!-- FILTROS POR CATEGORÍA -->
    <div class="mb-4">
        <h6 class="text-muted fw-semibold mb-2" style="font-size:0.8rem; text-transform:uppercase; letter-spacing:1px;">
            Filtrar por tipo
        </h6>
        <div class="d-flex flex-wrap gap-2">
            <button type="button" class="btn btn-danger btn-sm rounded-pill filtro-categoria active" data-categoria="todas">
                Todas
            </button>
            <button type="button"
                class="btn btn-outline-danger btn-sm rounded-pill filtro-categoria"
                th:each="cat : ${lstCategorias}"
                th:attr="data-categoria=${cat.idCategoria}"
                th:text="${cat.nombre}">
            </button>
        </div>
    </div>

    <!-- PIZZAS -->
    <h5 class="mb-3 fw-bold">
        <i class="fa-solid fa-pizza-slice me-2 text-danger"></i>Pizzas
    </h5>
    <div class="row g-4 mb-5">
        <div class="col-md-4 col-sm-6 tarjetaPizza"
             th:each="pizza : ${lstPizzas}"
             th:attr="data-categoria=${pizza.categoria != null ? pizza.categoria.idCategoria : ''}">
            <div class="card h-100 shadow-sm border-0" style="border-radius:12px; overflow:hidden;">
                <div style="position:relative;">
                    <img th:src="${pizza.imagen}"
                         class="card-img-top"
                         style="height:190px; object-fit:cover;"
                         th:alt="${pizza.nombre}">
                    <!-- Badge categoría sobre la imagen -->
                    <span class="badge bg-danger position-absolute"
                          style="top:10px; left:10px; font-size:0.72rem; border-radius:20px; padding:4px 10px;"
                          th:text="${pizza.categoria != null ? pizza.categoria.nombre : ''}">
                    </span>
                </div>
                <div class="card-body">
                    <h5 class="card-title fw-bold mb-1" th:text="${pizza.nombre}"></h5>
                    <p class="card-text text-muted small mb-2" th:text="${pizza.descripcion}"></p>

                    <div th:each="pt : ${lstPizzaTamanios}" th:if="${pt.pizza.idPizza == pizza.idPizza}">
                        <div class="d-flex justify-content-between align-items-center border-top pt-2 mt-1">
                            <span class="text-muted small" th:text="${pt.tamanio.descripcion}"></span>
                            <span class="fw-bold text-danger small"
                                  th:text="'S/ ' + ${#numbers.formatDecimal(pt.precio, 1, 2)}"></span>
                            <button class="btn btn-danger btn-sm rounded-circle btn-agregar-pizza"
                                    style="width:30px; height:30px; padding:0; font-size:0.8rem;"
                                    th:attr="data-id=${pt.idPizzaTamanio},
                                             data-nombre=${pizza.nombre + ' (' + pt.tamanio.descripcion + ')'},
                                             data-precio=${pt.precio}">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 text-center text-muted" id="sinResultados" style="display:none;">
            <i class="fa-solid fa-face-sad-tear fa-2x mb-2 d-block text-secondary"></i>
            No hay pizzas en esta categoría
        </div>
    </div>

    <!-- ADICIONALES -->
    <h5 class="mb-3 fw-bold">
        <i class="fa-solid fa-plus-circle me-2 text-success"></i>Adicionales
    </h5>
    <div class="row g-3">
        <div class="col-md-3 col-sm-6" th:each="adicional : ${lstAdicionales}">
            <div class="card h-100 shadow-sm border-0 text-center" style="border-radius:12px; overflow:hidden;">
				<img th:src="${adicional.imagen}"
                     class="card-img-top"
                     style="height:130px; object-fit:contain; padding:12px;"
                     th:alt="${adicional.descripcion}"
                     onerror="this.src='/img/adicionales/default.jpg'">
                <div class="card-body pt-2">
                    <h6 class="fw-bold mb-1" th:text="${adicional.descripcion}"></h6>
                    <p class="fw-bold text-success mb-2"
                       th:text="'S/ ' + ${#numbers.formatDecimal(adicional.precio, 1, 2)}"></p>
                    <button class="btn btn-outline-success btn-sm rounded-pill btn-agregar-adicional"
                        th:attr="data-id=${adicional.idAdicional},
                                 data-nombre=${adicional.descripcion},
                                 data-precio=${adicional.precio}">
                        <i class="fa-solid fa-plus me-1"></i>Agregar
                    </button>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- CARRITO OFFCANVAS -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="carrito">
    <div class="offcanvas-header border-bottom">
        <h5 class="offcanvas-title fw-bold">
            <i class="fa-solid fa-cart-shopping me-2 text-danger"></i>Tu pedido
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column">
        <div id="itemsCarrito" class="flex-grow-1 overflow-auto">
            <p class="text-muted text-center mt-4">
                <i class="fa-solid fa-cart-shopping fa-2x d-block mb-2 text-secondary"></i>
                Tu carrito está vacío
            </p>
        </div>
        <hr>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="text-muted">Total</span>
            <h5 class="mb-0 text-danger fw-bold">S/ <span id="totalCarrito">0.00</span></h5>
        </div>
        <button class="btn btn-danger w-100 fw-bold" id="btnRealizarPedido" disabled>
            <i class="fa-solid fa-check me-2"></i>Realizar Pedido
        </button>
    </div>
</div>

<!-- MODAL PEDIDO -->
<div class="modal fade" id="modalPedido" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow" style="border-radius:14px;">
            <div class="modal-header border-bottom">
                <h5 class="modal-title fw-bold">
                    <i class="fa-solid fa-receipt me-2 text-danger"></i>Datos del pedido
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Tu nombre</label>
                    <input type="text" class="form-control" id="nombreCliente" placeholder="Ej: Juan Pérez">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Método de pago</label>
                    <select class="form-select" id="metodoPago">
                        <option value="Efectivo">💵 Efectivo</option>
                        <option value="Tarjeta">💳 Tarjeta</option>
                        <option value="Yape">📱 Yape</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer border-top">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-danger fw-bold px-4" id="btnConfirmarPedido">
                    <i class="fa-solid fa-check me-1"></i>Confirmar
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    var carrito = [];

    // ── Filtro por categoría ──
    $(document).on('click', '.filtro-categoria', function () {
        $('.filtro-categoria').removeClass('active btn-danger').addClass('btn-outline-danger');
        $(this).removeClass('btn-outline-danger').addClass('active btn-danger');

        var categoria = $(this).data('categoria').toString();
        var visibles = 0;

        $('.tarjetaPizza').each(function () {
            var cat = $(this).attr('data-categoria').toString();
            var mostrar = (categoria === 'todas') || (cat === categoria);
            $(this).toggle(mostrar);
            if (mostrar) visibles++;
        });

        $('#sinResultados').toggle(visibles === 0);
    });

    // ── Agregar items ──
    $('.btn-agregar-pizza').on('click', function () {
        agregarItem('pizza', $(this).data('id'), $(this).data('nombre'), parseFloat($(this).data('precio')));
    });

    $('.btn-agregar-adicional').on('click', function () {
        agregarItem('adicional', $(this).data('id'), $(this).data('nombre'), parseFloat($(this).data('precio')));
    });

    function agregarItem(tipo, id, nombre, precio) {
        var item = carrito.find(i => i.tipo == tipo && i.id == id);
        if (item) { item.cantidad++; }
        else { carrito.push({ tipo, id, nombre, precio, cantidad: 1 }); }
        pintarCarrito();
    }

    function cambiarCantidad(tipo, id, delta) {
        var item = carrito.find(i => i.tipo == tipo && i.id == id);
        item.cantidad += delta;
        if (item.cantidad <= 0) carrito = carrito.filter(i => !(i.tipo == tipo && i.id == id));
        pintarCarrito();
    }

    function pintarCarrito() {
        var html = '', total = 0;
        carrito.forEach(function (item) {
            var subtotal = item.precio * item.cantidad;
            total += subtotal;
            html += `
            <div class="d-flex justify-content-between align-items-start mb-2 pb-2 border-bottom">
                <div>
                    <div class="fw-semibold" style="font-size:0.9rem">${item.nombre}</div>
                    <small class="text-muted">S/ ${item.precio.toFixed(2)} c/u</small>
                </div>
                <div class="d-flex align-items-center gap-2 ms-2">
                    <button class="btn btn-sm btn-outline-secondary rounded-circle"
                            style="width:26px;height:26px;padding:0;font-size:0.8rem"
                            onclick="cambiarCantidad('${item.tipo}',${item.id},-1)">−</button>
                    <span class="fw-bold">${item.cantidad}</span>
                    <button class="btn btn-sm btn-outline-secondary rounded-circle"
                            style="width:26px;height:26px;padding:0;font-size:0.8rem"
                            onclick="cambiarCantidad('${item.tipo}',${item.id},1)">+</button>
                </div>
            </div>`;
        });

        $('#itemsCarrito').html(html || `<p class="text-muted text-center mt-4">
            <i class="fa-solid fa-cart-shopping fa-2x d-block mb-2 text-secondary"></i>
            Tu carrito está vacío</p>`);
        $('#totalCarrito').text(total.toFixed(2));
        $('#contadorCarrito').text(carrito.length);
        $('#btnRealizarPedido').prop('disabled', carrito.length == 0);
    }

    $('#btnRealizarPedido').on('click', function () { $('#modalPedido').modal('show'); });

    $('#btnConfirmarPedido').on('click', function () {
        var nombreCliente = $('#nombreCliente').val().trim();
        if (!nombreCliente) {
            Swal.fire('Atención', 'Ingresa tu nombre para continuar', 'warning');
            return;
        }

        var idsPizzaTamanio = [], cantidadesPizza = [], idsAdicional = [], cantidadesAdicional = [];
        carrito.forEach(function (item) {
            if (item.tipo == 'pizza') {
                idsPizzaTamanio.push(item.id);
                cantidadesPizza.push(item.cantidad);
            } else {
                idsAdicional.push(item.id);
                cantidadesAdicional.push(item.cantidad);
            }
        });

        $.ajax({
            url: '/catalogo/realizar-pedido',
            method: 'POST',
            traditional: true,
            data: {
                nombreCliente,
                metodoPago: $('#metodoPago').val(),
                idsPizzaTamanio, cantidadesPizza,
                idsAdicional, cantidadesAdicional
            },
            success: function (response) {
                $('#modalPedido').modal('hide');
                if (response.success) {
                    carrito = [];
                    pintarCarrito();
                    window.location.href = '/pedido/comprobante/' + response.idPedido;
                } else {
                    Swal.fire('Error', response.mensaje, 'error');
                }
            },
            error: function () {
                Swal.fire('Error', 'No se pudo registrar el pedido', 'error');
            }
        });
    });
</script>

</body>
</html>
