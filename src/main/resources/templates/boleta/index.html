<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head}">
	<title>Boleta</title>
</head>

<body class="bg-light">

	<div class="container py-5">
		<div class="card shadow-sm mx-auto" style="max-width: 500px;">
			<div class="card-body p-4">

				<div class="text-center mb-3">
					<i class="fa-solid fa-pizza-slice fa-2x text-danger mb-2"></i>
					<h4 class="fw-bold mb-0">Pizzería</h4>
					<p class="text-muted small">Boleta de pedido</p>
				</div>

				<hr>

				<p class="mb-1"><span class="fw-bold">N° Pedido:</span> #<span th:text="${pedido.idPedido}"></span></p>
				<p class="mb-1"><span class="fw-bold">Cliente:</span> <span th:text="${pedido.nombreCliente}"></span></p>
				<p class="mb-1"><span class="fw-bold">Fecha:</span> <span th:text="${#temporals.format(pedido.fecha, 'dd/MM/yyyy HH:mm')}"></span></p>
				<p class="mb-1"><span class="fw-bold">Método de pago:</span> <span th:text="${pedido.metodoPago}"></span></p>
				<p class="mb-3"><span class="fw-bold">Estado:</span> <span class="text-capitalize" th:text="${pedido.estado}"></span></p>

				<hr>

				<table class="table table-sm">
					<thead>
						<tr>
							<th>Item</th>
							<th class="text-center">Cant.</th>
							<th class="text-end">Subtotal</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="dp : ${lstDetallePizza}">
							<td th:text="${dp.pizzaTamanio.pizza.nombre + ' (' + dp.pizzaTamanio.tamanio.descripcion + ')'}"></td>
							<td class="text-center" th:text="${dp.cantidad}"></td>
							<td class="text-end" th:text="'S/ ' + ${#numbers.formatDecimal(dp.subtotal, 1, 2)}"></td>
						</tr>
						<tr th:each="da : ${lstDetalleAdicional}">
							<td th:text="${da.adicional.descripcion}"></td>
							<td class="text-center" th:text="${da.cantidad}"></td>
							<td class="text-end" th:text="'S/ ' + ${#numbers.formatDecimal(da.subtotal, 1, 2)}"></td>
						</tr>
					</tbody>
				</table>

				<hr>

				<h5 class="text-end">Total: <span class="text-success" th:text="'S/ ' + ${#numbers.formatDecimal(pedido.total, 1, 2)}"></span></h5>

				<a href="/catalogo" class="btn btn-outline-secondary w-100 mt-2 no-print">
					<i class="fa-solid fa-arrow-left me-1"></i>Volver al catálogo
				</a>

			</div>
		</div>
	</div>

</body>

</html>
