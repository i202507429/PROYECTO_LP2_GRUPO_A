<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head}">
	<title>Listado Pizza-Tamaño</title>
</head>

<body class="bg-light">

	<div th:replace="~{fragments :: navbar}"></div>

	<div class="container py-4">

		<div class="d-flex justify-content-between align-items-center mb-4">
			<h2><i class="fa-solid fa-tags me-2"></i>Pizza - Tamaño</h2>
			<a href="/pizza-tamanio/nuevo" class="btn btn-primary">
				<i class="fa-solid fa-plus me-1"></i>Nuevo
			</a>
		</div>

		<!-- FILTROS -->
		<div class="card shadow-sm mb-3">
			<div class="card-body">
				<form method="get" action="/pizza-tamanio/listado" class="row g-2 align-items-end">
					<div class="col-md-4">
						<label class="form-label mb-1">Pizza</label>
						<select name="idPizza" class="form-select">
							<option value="">-- Todas --</option>
							<option th:each="p : ${lstPizzas}"
									th:value="${p.idPizza}"
									th:text="${p.nombre}"
									th:selected="${p.idPizza == idPizzaSeleccionado}">
							</option>
						</select>
					</div>
					<div class="col-md-4">
						<label class="form-label mb-1">Tamaño</label>
						<select name="idTamanio" class="form-select">
							<option value="">-- Todos --</option>
							<option th:each="t : ${lstTamanios}"
									th:value="${t.idTamanio}"
									th:text="${t.descripcion}"
									th:selected="${t.idTamanio == idTamanioSeleccionado}">
							</option>
						</select>
					</div>
					<div class="col-md-4 d-flex gap-2">
						<button type="submit" class="btn btn-secondary w-100">
							<i class="fa-solid fa-magnifying-glass me-1"></i>Filtrar
						</button>
						<a href="/pizza-tamanio/listado" class="btn btn-outline-secondary w-100">
							<i class="fa-solid fa-rotate-left me-1"></i>Limpiar
						</a>
					</div>
				</form>
			</div>
		</div>

		<div class="card shadow-sm">
			<div class="card-body">
				<table class="table table-hover align-middle mb-0">
					<thead class="table-dark">
						<tr>
							<th>#</th>
							<th>Pizza</th>
							<th>Tamaño</th>
							<th>Precio</th>
							<th>Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:if="${#lists.isEmpty(lstPizzaTamanios)}">
							<td colspan="5" class="text-center text-muted">No se encontraron registros</td>
						</tr>
						<tr th:each="pt : ${lstPizzaTamanios}">
							<td th:text="${pt.idPizzaTamanio}"></td>
							<td th:text="${pt.pizza.nombre}"></td>
							<td th:text="${pt.tamanio.descripcion}"></td>
							<td th:text="'S/ ' + ${#numbers.formatDecimal(pt.precio, 1, 2)}"></td>
							<td>
								<a th:href="@{/pizza-tamanio/edicion/{id}(id=${pt.idPizzaTamanio})}" class="btn btn-sm btn-warning">
									<i class="fa-solid fa-pen-to-square"></i>
								</a>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

	</div>

	<div th:if="${toast}" th:utext="${toast}"></div>

</body>

</html>
