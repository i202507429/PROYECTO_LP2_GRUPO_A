<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head}">
	<title>Nuevo Pizza-Tamaño</title>
</head>

<body class="bg-light">

	<div th:replace="~{fragments :: navbar}"></div>

	<div class="container py-4">

		<div class="d-flex justify-content-between align-items-center mb-4">
			<h2><i class="fa-solid fa-tags me-2"></i>Nuevo Pizza - Tamaño</h2>
			<a href="/pizza-tamanio/listado" class="btn btn-secondary">
				<i class="fa-solid fa-arrow-left me-1"></i>Volver
			</a>
		</div>

		<div class="card shadow-sm">
			<div class="card-body">
				<form th:action="@{/pizza-tamanio/registrar}" th:object="${pizzaTamanio}" method="post">

					<div class="mb-3">
						<label class="form-label fw-bold">Pizza</label>
						<select class="form-select" th:field="*{pizza.idPizza}" required>
							<option value="">-- Seleccione una pizza --</option>
							<option th:each="p : ${lstPizzas}"
								th:value="${p.idPizza}"
								th:text="${p.nombre}">
							</option>
						</select>
					</div>

					<div class="mb-3">
						<label class="form-label fw-bold">Tamaño</label>
						<select class="form-select" th:field="*{tamanio.idTamanio}" required>
							<option value="">-- Seleccione un tamaño --</option>
							<option th:each="t : ${lstTamanios}"
								th:value="${t.idTamanio}"
								th:text="${t.descripcion}">
							</option>
						</select>
					</div>

					<div class="mb-3">
						<label class="form-label fw-bold">Precio</label>
						<div class="input-group">
							<span class="input-group-text">S/</span>
							<input type="number" step="0.01" min="0.01" class="form-control" th:field="*{precio}" placeholder="0.00" required />
						</div>
					</div>

					<div class="d-flex justify-content-end gap-2">
						<a href="/pizza-tamanio/listado" class="btn btn-secondary">
							<i class="fa-solid fa-xmark me-1"></i>Cancelar
						</a>
						<button type="submit" class="btn btn-primary">
							<i class="fa-solid fa-floppy-disk me-1"></i>Registrar
						</button>
					</div>

				</form>
			</div>
		</div>

	</div>

	<div th:if="${alert}" th:utext="${alert}"></div>

</body>

</html>
