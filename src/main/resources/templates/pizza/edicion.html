<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head}">
    <title>Editar Pizza</title>
</head>

<body class="bg-light">

    <div class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fa-solid fa-pizza-slice me-2"></i>Editar Pizza</h2>
            <a href="/pizza/listado" class="btn btn-secondary">
                <i class="fa-solid fa-arrow-left me-1"></i>Volver
            </a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <form th:action="@{/pizza/guardar}" th:object="${pizza}" method="post">

                    <input type="hidden" th:field="*{idPizza}" />

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Nombre</label>
                            <input type="text" class="form-control" th:field="*{nombre}" required />
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Categoría</label>
                            <select class="form-select" th:field="*{categoria.idCategoria}" required>
                                <option value="">-- Selecciona --</option>
                                <option th:each="cat : ${lstCategorias}"
                                        th:value="${cat.idCategoria}"
                                        th:text="${cat.nombre}">
                                </option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold">Descripción</label>
                            <textarea class="form-control" th:field="*{descripcion}" rows="2"></textarea>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Imagen (URL)</label>
                            <input type="text" class="form-control" th:field="*{imagen}" />
                        </div>

                        <div class="col-md-3">
                            <label class="form-label fw-bold">Estado</label>
                            <select class="form-select" th:field="*{activo}">
                                <option value="true">Activo</option>
                                <option value="false">Inactivo</option>
                            </select>
                        </div>

                    </div>

                    <!-- TAMAÑOS Y PRECIOS -->
                    <hr class="my-4">
                    <h5 class="mb-3"><i class="fa-solid fa-ruler me-2"></i>Tamaños y precios</h5>

                    <div class="row g-3">
                        <div class="col-md-4" th:each="tam : ${lstTamanios}"
                             th:with="ptActual=${tamaniosActuales.?[tamanio.idTamanio == __${tam.idTamanio}__].isEmpty() ? null : tamaniosActuales.?[tamanio.idTamanio == __${tam.idTamanio}__][0]}">

                            <div class="card border-2"
                                 th:classappend="${ptActual != null} ? '' : 'border-secondary opacity-50'"
                                 th:id="'card-' + ${tam.idTamanio}">
                                <div class="card-body py-2">
                                    <div class="form-check mb-2">
                                        <input class="form-check-input tamanio-check" type="checkbox"
                                               name="tamanioIds"
                                               th:value="${tam.idTamanio}"
                                               th:id="'chk-' + ${tam.idTamanio}"
                                               th:checked="${ptActual != null}"
                                               onchange="togglePrecio(this)">
                                        <label class="form-check-label fw-bold"
                                               th:for="'chk-' + ${tam.idTamanio}"
                                               th:text="${tam.descripcion}">
                                        </label>
                                    </div>
                                    <div th:id="'precio-wrap-' + ${tam.idTamanio}"
                                         th:style="${ptActual == null} ? 'display:none' : ''">
                                        <label class="form-label small mb-1">Precio (S/)</label>
                                        <input type="number" class="form-control form-control-sm"
                                               name="precios"
                                               step="0.01" min="0.01"
                                               th:value="${ptActual != null ? ptActual.precio : ''}"
                                               th:required="${ptActual != null}">
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="/pizza/listado" class="btn btn-secondary">
                            <i class="fa-solid fa-xmark me-1"></i>Cancelar
                        </a>
                        <button type="submit" class="btn btn-warning">
                            <i class="fa-solid fa-floppy-disk me-1"></i>Guardar cambios
                        </button>
                    </div>

                </form>
            </div>
        </div>

    </div>

    <div th:if="${alert}" th:utext="${alert}"></div>

    <script>
        function togglePrecio(checkbox) {
            const wrap = document.getElementById('precio-wrap-' + checkbox.value);
            const card = document.getElementById('card-' + checkbox.value);
            const input = wrap.querySelector('input[type="number"]');
            if (checkbox.checked) {
                wrap.style.display = '';
                input.required = true;
                card.classList.remove('border-secondary', 'opacity-50');
            } else {
                wrap.style.display = 'none';
                input.required = false;
                input.value = '';
                card.classList.add('border-secondary', 'opacity-50');
            }
        }
    </script>

</body>
</html>
