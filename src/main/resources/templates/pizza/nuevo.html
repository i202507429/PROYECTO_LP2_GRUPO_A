<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head}">
	<title>Nueva Pizza</title>
</head>

<body class="bg-light">

	<div class="container py-4">

		<!-- Encabezado -->
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h2><i class="fa-solid fa-pizza-slice me-2"></i>Nueva Pizza</h2>
			<a href="/pizza/listado" class="btn btn-secondary">
				<i class="fa-solid fa-arrow-left me-1"></i>Volver
			</a>
		</div>

		<!-- Formulario -->
		<div class="card shadow-sm">
			<div class="card-body">
				<form th:action="@{/pizza/registrar}" th:object="${pizza}" method="post">

					<div class="mb-3">
						<label class="form-label fw-bold">Nombre</label>
						<input type="text" class="form-control" th:field="*{nombre}" placeholder="Ej: Pepperoni"
							required />
					</div>

					<div class="mb-3">
						<label class="form-label fw-bold">Descripción</label>
						<textarea class="form-control" th:field="*{descripcion}" rows="3"
							placeholder="Ej: Salsa de tomate, mozzarella y pepperoni">
                        </textarea>
					</div>

					<div class="mb-3">
						<label class="form-label fw-bold">Imagen</label>
						<input type="text" class="form-control" th:field="*{imagen}" placeholder="Ej: pepperoni.jpg" />
						<div class="form-text">Nombre del archivo de imagen</div>
					</div>

					<div class="d-flex justify-content-end gap-2">
						<a href="/pizza/listado" class="btn btn-secondary">
							<i class="fa-solid fa-xmark me-1"></i>Cancelar
						</a>
						<button type="submit" class="btn btn-primary">
							<i class="fa-solid fa-floppy-disk me-1"></i>Registrar
						</button>
					</div>

				</form>
			</div>
		</div>

	</div>

	<!-- Alert error -->
	<div th:if="${alert}" th:utext="${alert}"></div>

</body>

</html>
