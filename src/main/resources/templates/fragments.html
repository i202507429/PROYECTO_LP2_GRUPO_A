<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<!-- Bootstrap 5 -->
	<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />

	<!-- Font Awesome 6.5.0 -->
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

	<!-- SweetAlert2 -->
	<link href="https://cdnjs.cloudflare.com/ajax/libs/limonte-sweetalert2/11.10.6/sweetalert2.min.css" rel="stylesheet" />

	<!-- jQuery -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

	<!-- Bootstrap JS -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

	<!-- SweetAlert2 JS -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/limonte-sweetalert2/11.10.6/sweetalert2.min.js"></script>
</head>

<body>
	<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
		<div class="container">
			<a class="navbar-brand fw-bold" href="/home">
				<i class="fa-solid fa-pizza-slice me-2"></i>Pizzería
			</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navMenu">
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">

					<!-- Solo visible para administradores -->
					<li class="nav-item" th:if="${session.usuarioSesion != null and session.usuarioSesion.tipo.idTipo == 1}">
						<a class="nav-link" href="/home"><i class="fa-solid fa-house me-1"></i>Inicio</a>
					</li>

					<!-- Solo visible para administradores -->
					<li class="nav-item dropdown" th:if="${session.usuarioSesion != null and session.usuarioSesion.tipo.idTipo == 1}">
						<a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
							<i class="fa-solid fa-gear me-1"></i>Mantenimiento
						</a>
						<ul class="dropdown-menu">
							<li><a class="dropdown-item" href="/pizza/listado"><i class="fa-solid fa-pizza-slice me-2"></i>Pizzas</a></li>
							<li><a class="dropdown-item" href="/tamanio/listado"><i class="fa-solid fa-ruler me-2"></i>Tamaños</a></li>
							<li><a class="dropdown-item" href="/pizza-tamanio/listado"><i class="fa-solid fa-tags me-2"></i>Pizza-Tamaño</a></li>
							<li><a class="dropdown-item" href="/adicional/listado"><i class="fa-solid fa-plus-circle me-2"></i>Adicionales</a></li>
							<li><hr class="dropdown-divider"></li>
							<li><a class="dropdown-item" href="/usuario/listado"><i class="fa-solid fa-users me-2"></i>Usuarios</a></li>
						</ul>
					</li>

					<li class="nav-item">
						<a class="nav-link" href="/pedido/listado"><i class="fa-solid fa-clipboard-list me-1"></i>Pedidos</a>
					</li>
				</ul>

				<!-- Usuario logueado + logout (visible para TODOS los logueados) -->
				<ul class="navbar-nav ms-auto mb-2 mb-lg-0" th:if="${session.usuarioSesion != null}">
					<li class="nav-item dropdown">
						<a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
							<i class="fa-solid fa-user me-1"></i>
							<span th:text="${session.usuarioSesion.nombres + ' ' + session.usuarioSesion.apellidos}">Usuario</span>
						</a>
						<ul class="dropdown-menu dropdown-menu-end">
							<li><a class="dropdown-item" href="/logout"><i class="fa-solid fa-right-from-bracket me-2"></i>Cerrar sesión</a></li>
						</ul>
					</li>
				</ul>
			</div>
		</div>
	</nav>
</body>

</html>
