<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head}">
	<title>Listado de Usuarios</title>
</head>

<body class="bg-light">

	<div th:replace="~{fragments :: navbar}"></div>

	<div class="container py-4">

		<div class="d-flex justify-content-between align-items-center mb-4">
			<h2><i class="fa-solid fa-users me-2"></i>Usuarios</h2>
			<a href="/usuario/nuevo" class="btn btn-primary">
				<i class="fa-solid fa-plus me-1"></i>Nuevo Usuario
			</a>
		</div>

		<div class="card shadow-sm">
			<div class="card-body">
				<table class="table table-hover align-middle mb-0">
					<thead class="table-dark">
						<tr>
							<th>#</th>
							<th>Nombres</th>
							<th>Apellidos</th>
							<th>Cuenta</th>
							<th>Tipo</th>
							<th>Estado</th>
							<th>Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="usuario : ${lstUsuarios}">
							<td th:text="${usuario.idUsuario}"></td>
							<td th:text="${usuario.nombres}"></td>
							<td th:text="${usuario.apellidos}"></td>
							<td th:text="${usuario.cuenta}"></td>
							<td th:text="${usuario.tipo.descripcion}"></td>
							<td>
								<span th:classappend="${usuario.activo} ? 'badge bg-success' : 'badge bg-danger'"
									th:text="${usuario.activo} ? 'Activo' : 'Inactivo'">
								</span>
							</td>
							<td class="d-flex gap-1">
								<a th:href="@{/usuario/edicion/{id}(id=${usuario.idUsuario})}" class="btn btn-sm btn-warning">
									<i class="fa-solid fa-pen-to-square"></i>
								</a>
								<form th:action="@{/usuario/cambiar-estado/{id}(id=${usuario.idUsuario})}" method="post">
									<button type="submit" class="btn btn-sm" 
									    th:classappend="${usuario.activo} ? 'btn-success' : 'btn-secondary'"
									    th:title="${usuario.activo} ? 'Desactivar' : 'Activar'">
									    <i class="fa-solid" th:classappend="${usuario.activo} ? 'fa-toggle-on' : 'fa-toggle-off'"></i>
									</button>
								</form>
								<form th:action="@{/usuario/eliminar/{id}(id=${usuario.idUsuario})}" method="post" class="form-eliminar">
									<button type="submit" class="btn btn-sm btn-danger">
										<i class="fa-solid fa-trash"></i>
									</button>
								</form>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

	</div>

	<div th:if="${toast}" th:utext="${toast}"></div>

	<script>
		document.querySelectorAll('.form-eliminar').forEach(function (form) {
			form.addEventListener('submit', function (e) {
				e.preventDefault();
				Swal.fire({
					title: '¿Eliminar?',
					text: 'Esta acción no se puede deshacer',
					icon: 'warning',
					showCancelButton: true,
					confirmButtonText: 'Sí, eliminar',
					cancelButtonText: 'Cancelar',
					confirmButtonColor: '#dc3545'
				}).then(function (result) {
					if (result.isConfirmed) form.submit();
				});
			});
		});
	</script>

</body>

</html>
