<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head}">
	<title>Nuevo Usuario</title>
</head>

<body class="bg-light">

	<div th:replace="~{fragments :: navbar}"></div>

	<div class="container py-4">

		<div class="d-flex justify-content-between align-items-center mb-4">
			<h2><i class="fa-solid fa-user-plus me-2"></i>Nuevo Usuario</h2>
			<a href="/usuario/listado" class="btn btn-secondary">
				<i class="fa-solid fa-arrow-left me-1"></i>Volver
			</a>
		</div>

		<div class="card shadow-sm">
			<div class="card-body">
				<form th:action="@{/usuario/registrar}" th:object="${usuario}" method="post">

					<div class="row">
						<div class="col-md-6 mb-3">
							<label class="form-label fw-bold">Nombres</label>
							<input type="text" class="form-control" th:field="*{nombres}" placeholder="Ej: Carlos" required />
						</div>
						<div class="col-md-6 mb-3">
							<label class="form-label fw-bold">Apellidos</label>
							<input type="text" class="form-control" th:field="*{apellidos}" placeholder="Ej: Quispe" required />
						</div>
					</div>

					<div class="mb-3">
						<label class="form-label fw-bold">Cuenta (email)</label>
						<input type="email" class="form-control" th:field="*{cuenta}" placeholder="Ej: carlos@pizzeria.com" required />
					</div>

					<div class="mb-3">
						<label class="form-label fw-bold">Clave</label>
						<input type="password" class="form-control" th:field="*{clave}" placeholder="Contraseña" required />
					</div>

					<div class="mb-3">
						<label class="form-label fw-bold">Tipo</label>
						<select class="form-select" th:field="*{tipo.idTipo}" required>
							<option value="">-- Seleccione un tipo --</option>
							<option th:each="t : ${lstTipos}"
								th:value="${t.idTipo}"
								th:text="${t.descripcion}">
							</option>
						</select>
					</div>

					<div class="d-flex justify-content-end gap-2">
						<a href="/usuario/listado" class="btn btn-secondary">
							<i class="fa-solid fa-xmark me-1"></i>Cancelar
						</a>
						<button type="submit" class="btn btn-primary">
							<i class="fa-solid fa-floppy-disk me-1"></i>Registrar
						</button>
					</div>

				</form>
			</div>
		</div>

	</div>

	<div th:if="${alert}" th:utext="${alert}"></div>

</body>

</html>
