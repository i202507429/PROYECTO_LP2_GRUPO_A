<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head}">
	<title>Nuevo Tamaño</title>
</head>

<body class="bg-light">

	<div th:replace="~{fragments :: navbar}"></div>

	<div class="container py-4">

		<div class="d-flex justify-content-between align-items-center mb-4">
			<h2><i class="fa-solid fa-ruler me-2"></i>Nuevo Tamaño</h2>
			<a href="/tamanio/listado" class="btn btn-secondary">
				<i class="fa-solid fa-arrow-left me-1"></i>Volver
			</a>
		</div>

		<div class="card shadow-sm">
			<div class="card-body">
				<form th:action="@{/tamanio/registrar}" th:object="${tamanio}" method="post">

					<div class="mb-3">
						<label class="form-label fw-bold">ID</label>
						<input type="number" class="form-control" th:field="*{idTamanio}" placeholder="Ej: 4" required />
						<div class="form-text">El ID es manual porque la tabla no tiene auto_increment</div>
					</div>

					<div class="mb-3">
						<label class="form-label fw-bold">Descripción</label>
						<input type="text" class="form-control" th:field="*{descripcion}" placeholder="Ej: Gigante" required />
					</div>

					<div class="d-flex justify-content-end gap-2">
						<a href="/tamanio/listado" class="btn btn-secondary">
							<i class="fa-solid fa-xmark me-1"></i>Cancelar
						</a>
						<button type="submit" class="btn btn-primary">
							<i class="fa-solid fa-floppy-disk me-1"></i>Registrar
						</button>
					</div>

				</form>
			</div>
		</div>

	</div>

	<div th:if="${alert}" th:utext="${alert}"></div>

</body>

</html>
