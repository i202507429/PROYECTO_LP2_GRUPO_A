<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head}">
	<title>Editar Tamaño</title>
</head>

<body class="bg-light">

	<div th:replace="~{fragments :: navbar}"></div>

	<div class="container py-4">

		<div class="d-flex justify-content-between align-items-center mb-4">
			<h2><i class="fa-solid fa-ruler me-2"></i>Editar Tamaño</h2>
			<a href="/tamanio/listado" class="btn btn-secondary">
				<i class="fa-solid fa-arrow-left me-1"></i>Volver
			</a>
		</div>

		<div class="card shadow-sm">
			<div class="card-body">
				<form th:action="@{/tamanio/guardar}" th:object="${tamanio}" method="post">

					<input type="hidden" th:field="*{idTamanio}" />

					<div class="mb-3">
						<label class="form-label fw-bold">Descripción</label>
						<input type="text" class="form-control" th:field="*{descripcion}" required />
					</div>

					<div class="d-flex justify-content-end gap-2">
						<a href="/tamanio/listado" class="btn btn-secondary">
							<i class="fa-solid fa-xmark me-1"></i>Cancelar
						</a>
						<button type="submit" class="btn btn-warning">
							<i class="fa-solid fa-floppy-disk me-1"></i>Guardar cambios
						</button>
					</div>

				</form>
			</div>
		</div>

	</div>

	<div th:if="${alert}" th:utext="${alert}"></div>

</body>

</html>
