<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head}">
	<title>Listado de Tamaños</title>
</head>

<body class="bg-light">

	<div th:replace="~{fragments :: navbar}"></div>

	<div class="container py-4">

		<div class="d-flex justify-content-between align-items-center mb-4">
			<h2><i class="fa-solid fa-ruler me-2"></i>Tamaños</h2>
			<a href="/tamanio/nuevo" class="btn btn-primary">
				<i class="fa-solid fa-plus me-1"></i>Nuevo Tamaño
			</a>
		</div>

		<div class="card shadow-sm">
			<div class="card-body">
				<table class="table table-hover align-middle mb-0">
					<thead class="table-dark">
						<tr>
							<th>#</th>
							<th>Descripción</th>
							<th>Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="tamanio : ${lstTamanios}">
							<td th:text="${tamanio.idTamanio}"></td>
							<td th:text="${tamanio.descripcion}"></td>
							<td class="d-flex gap-1">
							    <a th:href="@{/tamanio/edicion/{id}(id=${tamanio.idTamanio})}" class="btn btn-sm btn-warning">
							        <i class="fa-solid fa-pen-to-square"></i>
							    </a>
							    <form th:action="@{/tamanio/eliminar/{id}(id=${tamanio.idTamanio})}" method="post" class="form-eliminar">
							        <button type="submit" class="btn btn-sm btn-danger">
							            <i class="fa-solid fa-trash"></i>
							        </button>
							    </form>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

	</div>

	<div th:if="${toast}" th:utext="${toast}"></div>

	<script>
		document.querySelectorAll('.form-eliminar').forEach(function (form) {
			form.addEventListener('submit', function (e) {
				e.preventDefault();
				Swal.fire({
					title: '¿Eliminar?',
					text: 'Esta acción no se puede deshacer',
					icon: 'warning',
					showCancelButton: true,
					confirmButtonText: 'Sí, eliminar',
					cancelButtonText: 'Cancelar',
					confirmButtonColor: '#dc3545'
				}).then(function (result) {
					if (result.isConfirmed) form.submit();
				});
			});
		});
	</script>

	<div id="dataModalEliminacion"
	     th:if="${modalEliminacion}"
	     th:data-mensaje="${modalEliminacion}"
	     th:data-tipo="${modalTipo}"
	     style="display:none;"></div>

	<script>
		const dataModal = document.getElementById('dataModalEliminacion');
		if (dataModal) {
			Swal.fire({
				icon: dataModal.dataset.tipo,
				title: dataModal.dataset.tipo === 'success' ? 'Eliminado' : 'No se pudo eliminar',
				text: dataModal.dataset.mensaje,
				confirmButtonColor: '#dc3545'
			});
		}
	</script>

</body>

</html>
